spring:
  application:
    name: discovery-service

  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 25s


server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false


