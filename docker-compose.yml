services:

  # ---------------------------------------------------------------------------
  # Gateway Service (Spring Cloud Gateway)
  # ---------------------------------------------------------------------------
  gateway-service:
    image: micromart/gateway-service
    container_name: micromart-gateway-service
    build:
      context: ./gateway-service
      dockerfile: Dockerfile

    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      ACCESS_TOKEN_SECURITY_KEY: ${ACCESS_TOKEN_SECRET_KEY}

    ports:
      - "8080:8080"

    networks:
      - micromart-network

# -----------------------------------------------------------------------------
# Networks and Volumes
# -----------------------------------------------------------------------------
networks:
  micromart-network:
    driver: bridge

